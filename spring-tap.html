<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Spring Tap Test (transplant f1)</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; background:#000; color:#ccc; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',monospace; }
#app { display:flex; flex-direction:column; height:100%; }
#controls { display:flex; align-items:center; gap:6px; padding:6px 10px; background:#111; border-bottom:1px solid #222; flex-wrap:wrap; flex-shrink:0; }
#controls button { background:#222; color:#ccc; border:1px solid #444; border-radius:5px; padding:6px 12px; font-size:13px; cursor:pointer; touch-action:manipulation; }
#controls button:active { background:#333; }
#controls button:disabled { opacity:0.4; cursor:default; }
#status { margin-left:auto; font-size:11px; color:#8f8; white-space:nowrap; }
#dims { display:flex; gap:8px; padding:6px 10px; background:#0d0d0d; border-bottom:1px solid #222; flex-wrap:wrap; align-items:center; flex-shrink:0; }
#dims label { font-size:10px; color:#555; }
#dims input[type=number],#dims select { background:#222; color:#ccc; border:1px solid #444; border-radius:4px; padding:3px 5px; font-size:12px; width:70px; }
#dims select { width:auto; }
#pred { font-size:11px; color:#888; padding:4px 10px; background:#0d0d0d; border-bottom:1px solid #222; }
#canvas-wrap { flex:1; position:relative; min-height:200px; }
#canvas { width:100%; height:100%; display:block; background:#000; }
#result { font-size:12px; padding:6px 10px; background:#0d0d0d; border-top:1px solid #222; max-height:38%; overflow-y:auto; }
#result table { border-collapse:collapse; font-size:12px; margin-top:4px; }
#result td,#result th { border:1px solid #333; padding:3px 8px; text-align:right; }
#result th { color:#888; font-weight:normal; }
td.good { color:#8f8; } td.bad { color:#f88; }
.dim { color:#666; font-size:11px; }
.peakline { color:#fff; }
#build { font-size:10px; color:#444; padding:2px 10px; }
.taphead { font-size:11px; color:#4d4; margin:6px 0 2px; letter-spacing:1px; }
.taphead:first-child { margin-top:0; }
.shot img { width:100%; max-width:660px; border:1px solid #333; border-radius:4px; display:block; margin-top:5px; }
.shot a { text-decoration:none; }
.warn { color:#f90; }
</style>
</head>
<body>
<div id="app">
  <div id="controls">
    <button id="btnStart">▶ Start mic</button>
    <button id="btnStop">■ Stop</button>
    <button id="btnCap" disabled>⏺ Record 5 s</button>
    <button id="btnClear">✕ Clear log</button>
    <span id="status">Ready — press Start, then just tap the spring</span>
  </div>
  <div id="dims">
    <label id="lblL">Length mm</label><input type="number" id="inL" value="210" step="0.1">
    <label>Width mm</label><input type="number" id="inW" value="40" step="0.1">
    <label>Thick mm</label><input type="number" id="inT" value="4.89" step="0.01">
    <label>Mass g</label><input type="number" id="inM" value="" step="0.1">
    <label>E-L GPa</label><input type="number" id="inE1" value="31" step="0.5">
    <label>E-W GPa</label><input type="number" id="inE2" value="10" step="0.5">
    <label>Ends</label>
    <select id="inB"><option value="ff" selected>Free-free</option><option value="cant">Cantilever</option></select>
  </div>
  <div id="pred"></div>
  <div id="canvas-wrap"><canvas id="canvas"></canvas></div>
  <div id="result"><span class="dim">Press Start, then tap the spring as many times as you like — 5 seconds of tapping becomes ONE result, keeping the strongest level every mode reached.</span></div>
  <div id="build">spring-tap transplant f1 · 2026-10-14</div>
</div>
<script>
const FFT_SIZE = 4096;
const FPS = 30;
// predictions
const BETA = { ff:[4.7300408,7.8532046,10.9956079,14.1371655], cant:[1.8751041,4.6940911,7.8547574,10.9955407] };
// explicit element handles (same pattern as proven tuner)
const btnStart = document.getElementById('btnStart');
const btnStop = document.getElementById('btnStop');
const btnCap = document.getElementById('btnCap');
const statusEl = document.getElementById('status');
const predEl = document.getElementById('pred');
const resultEl = document.getElementById('result');
const inL = document.getElementById('inL'), inW = document.getElementById('inW'),
      inT = document.getElementById('inT'), inM = document.getElementById('inM'),
      inE1 = document.getElementById('inE1'), inE2 = document.getElementById('inE2'),
      inB = document.getElementById('inB'), lblL = document.getElementById('lblL');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
// audio state (same pattern as proven tuner)
let audioCtx = null, analyser = null, source = null, stream = null, hpFilter = null;
let wakeLock = null;
async function requestWake(){
  try{
    if('wakeLock' in navigator){
      try{ if(wakeLock) await wakeLock.release(); }catch(_){}
      wakeLock = await navigator.wakeLock.request('screen');
    }
  }catch(_){}
}
async function releaseWake(){ try{ if(wakeLock){ await wakeLock.release(); wakeLock=null; } }catch(_){} }
document.addEventListener('visibilitychange', async ()=>{
  if(document.visibilityState==='visible' && running) await requestWake();
});
let running = false, frames = [], animId = null, lastFrameTime = 0;
let canvasW = 0, canvasH = 0, sampleRate = 44100, binWidth = 0;
let smoothBuf = null, livePeaks = [], micLevelDb = -999, micTimeBuf = null;
let silentFrames = 0, lastLive = null;
let tapNo = 0, session = null;               // session = {endsAt, taps}
let lastTapAt = 0, prevLvl = -999, floorDb = -999, lastResultAt = 0;
let envBuf = null;
const SESSION_MS = 5000;                     // one session = 5 s of tapping, as many places as you like

async function startAudio() {
  try {
    if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      statusEl.textContent = 'Mic needs the https page in Chrome/Safari (not a preview or in-app browser).';
      return false;
    }
    // never hang silently: a pending prompt / absent mic must surface as an error
    stream = await Promise.race([
      navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:true } }),
      new Promise((_, rej)=>setTimeout(()=>rej(new Error('No answer from the microphone after 12s — permission prompt still pending, or no working mic on this device.')), 12000))
    ]);
    audioCtx = new AudioContext();
    sampleRate = audioCtx.sampleRate;
    source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = FFT_SIZE;
    analyser.smoothingTimeConstant = 0.5;
    analyser.minDecibels = -90;
    analyser.maxDecibels = -10;
    hpFilter = audioCtx.createBiquadFilter();
    hpFilter.type = 'highpass'; hpFilter.frequency.value = 70;
    source.connect(hpFilter); hpFilter.connect(analyser);
    binWidth = sampleRate / FFT_SIZE;
    smoothBuf = null;
    // do NOT await resume(): it can stay pending forever and silently freeze the whole start path
    if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    return true;
  } catch(e){
    const n = (e && e.name) || '';
    if(n==='NotAllowedError' || n==='SecurityError')
      statusEl.textContent = 'Mic BLOCKED — padlock/ⓘ → Permissions → Microphone → Allow, then Start again.';
    else statusEl.textContent = 'Mic error: ' + (e.message || e);
    return false;
  }
}
function stopAudio() {
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; }
  if(audioCtx){ audioCtx.close(); audioCtx = null; }
  analyser = null; source = null;
}
function capture() {
  if(!analyser) return null;
  const data = new Float32Array(analyser.frequencyBinCount);
  analyser.getFloatFrequencyData(data);
  return data;
}
function smoothSpectrum(raw){
  const alpha = 0.30;
  if(!smoothBuf || smoothBuf.length!==raw.length){ smoothBuf = Float32Array.from(raw); }
  else{ for(let i=0;i<raw.length;i++) smoothBuf[i] += alpha*(raw[i]-smoothBuf[i]); }
  return smoothBuf;
}
function findSpringPeaks(spec, floorDb){
  for(let i=0;i<spec.length;i++){ if(!isFinite(spec[i])) spec[i] = -120; }
  if(!isFinite(floorDb)) floorDb = -80;
  const out = [];
  const maxBin = Math.min(spec.length-4, Math.floor(8000/binWidth));
  for(let i=3;i<maxBin;i++){
    const v = spec[i];
    if(v<floorDb || v<=spec[i-1] || v<=spec[i+1] || v<spec[i-2] || v<spec[i+2]) continue;
    let lMin=v, rMin=v;
    for(let k=1;k<=4;k++){ if(spec[i-k]<lMin)lMin=spec[i-k]; if(spec[i+k]<rMin)rMin=spec[i+k]; }
    const prom = v - Math.max(lMin, rMin);
    if(!isFinite(prom) || prom<6) continue;
    const y1=spec[i-1], y2=spec[i], y3=spec[i+1], den=(2*y2-y1-y3);
    if(den<=0) continue;
    let off=(y3-y1)/(2*den); if(!isFinite(off)||Math.abs(off)>0.5) off=0;
    const freq=(i+off)*binWidth;
    if(!isFinite(freq)||freq<70||freq>8000) continue;
    const peakDb=y2-(y3-y1)*off/4;
    if(!isFinite(peakDb)) continue;
    out.push({freq, db:peakDb, prom});
  }
  out.sort((a,b)=>(b.db+b.prom*0.3)-(a.db+a.prom*0.3));
  const kept=[];
  for(const c of out){
    if(kept.some(k=>Math.abs(c.freq-k.freq)/k.freq<0.03)) continue;
    kept.push(c); if(kept.length>=16) break;
  }
  return kept;
}
function updateMicLevel(){
  try{
    if(!analyser) return;
    if(!micTimeBuf || micTimeBuf.length!==analyser.fftSize) micTimeBuf = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(micTimeBuf);
    let sum=0; for(let i=0;i<micTimeBuf.length;i+=4){ sum += micTimeBuf[i]*micTimeBuf[i]; }
    const rms = Math.sqrt(sum/(micTimeBuf.length/4));
    micLevelDb = rms>0 ? 20*Math.log10(rms+1e-9) : -120;
  }catch(_){}
}
function onNewFrame(raw){
  updateMicLevel();
  // MAX ENVELOPE, no decay: the highest level every bin reaches during the session, so
  // tapping in several places accumulates every mode at its strongest.
  if(session){
    if(!envBuf || envBuf.length !== raw.length){ envBuf = new Float32Array(raw.length).fill(-120); }
    for(let i=0;i<raw.length;i++){ if(raw[i] > envBuf[i]) envBuf[i] = raw[i]; }
  }
  const spec = smoothSpectrum(raw);
  livePeaks = findSpringPeaks(spec, -80);
  frames.push(raw);
  if(frames.length > 3600) frames.shift();
  return livePeaks;
}
// predictions
// bending frequency for ONE family: span = the axis the wave runs along, E = the
// modulus along that SAME axis. E belongs to the axis, never to the number.
function beamF(span, T, E, rho, bL){
  return (bL*bL*T/(2*Math.PI*span*span))*Math.sqrt(E/(12*rho));
}
function calcPred(){
  const L=+inL.value/1000, W=+inW.value/1000, T=+inT.value/1000;
  const m=+inM.value/1000;
  const E1=+inE1.value*1e9, E2=+inE2.value*1e9;
  const rho = m>0 ? m/(L*W*T) : 1900;
  const B = BETA[inB.value] || BETA.ff;
  // TWO families: bending along L (governed by E-L) and along W (governed by E-W).
  // A short, soft direction can be the LOWEST mode even though it is the "width", so
  // both are predicted and merged by frequency. The dimensions are never swapped by
  // hand: that would carry E-L across to the other axis (measured 76% error on a
  // 166x138x2.25 part). The app works the order out itself.
  const ladder = [];
  if(E1 > 0) B.forEach((b,n)=>{ ladder.push({f:beamF(L,T,E1,rho,b), axis:'L', harm:n+1, E:E1, label:'L'+(n+1)}); });
  if(E2 > 0) B.forEach((b,n)=>{ ladder.push({f:beamF(W,T,E2,rho,b), axis:'W', harm:n+1, E:E2, label:'W'+(n+1)}); });
  if(!ladder.length) B.forEach((b,n)=>{ ladder.push({f:beamF(L,T,31e9,rho,b), axis:'L', harm:n+1, E:31e9, label:'L'+(n+1)}); });
  ladder.sort((a,b)=>a.f-b.f);
  // shortcut: beam-per-axis ignores plate (Poisson) coupling and torsion; when the two
  // dimensions are comparable it is a trend, not an absolute. Add plate theory when a
  // wide part's modulus has to be quoted, not just compared.
  const aspect = Math.min(L,W)/Math.max(L,W);
  return { L,W,T,rho,E1,E2, hasMass:m>0, ladder, aspect };
}
function showPred(){
  const p = calcPred();
  // cantilever L is the FREE length: clamp face to tip, not the blank length
  lblL.textContent = inB.value === 'cant' ? 'Free length mm (clamp→tip)' : 'Length mm';
  const dens = p.hasMass ? (p.rho.toFixed(0)+' kg/m³ (weighed)') : (p.rho.toFixed(0)+' kg/m³ (ASSUMED — weigh a spring!)');
  const top = p.ladder.slice(0,4).map(m=>'<b>'+m.f.toFixed(0)+'</b> '+m.label).join(' · ');
  // a peak cannot be assigned to two predictions that sit within a few percent
  let tight = 0;
  for(let i=1;i<p.ladder.length;i++){ if(p.ladder[i].f/p.ladder[i-1].f < 1.10) tight++; }
  const tightWarn = tight
    ? ' <span class="warn">'+tight+' predicted pair'+(tight>1?'s':'')+' inside 10% — those peaks cannot be assigned to one mode reliably</span>' : '';
  const warn = tightWarn + (p.aspect > 0.5
    ? ' <span class="warn">plate, not beam ('+p.aspect.toFixed(2)+' short/long) — treat as a trend, not an absolute</span>' : '');
  const cantNote = inB.value === 'cant'
    ? ' &nbsp;<span class="dim">L = free length from the clamp face to the tip; a real clamp is not infinitely stiff, so expect a few % low</span>' : '';
  predEl.innerHTML = 'Modes in frequency order: '+top+' Hz'+cantNote+warn+
    ' &nbsp; <span class="dim">ρ '+dens+' · E = E_nom × (f_meas/f_pred)²</span>';
  return p;
}
// canvas
function resizeCanvas(){
  const wrap = document.getElementById('canvas-wrap');
  const rect = wrap.getBoundingClientRect();
  canvasW = Math.max(50, Math.floor(rect.width)); canvasH = Math.max(50, Math.floor(rect.height));
  canvas.width = canvasW; canvas.height = canvasH;
}
function drawSpectrum(){
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,canvasW,canvasH);
  const p = calcPred();
  ctx.font = '11px monospace'; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  let lastLblX = -999, bump = 0;
  p.ladder.slice(0,6).forEach((m,i)=>{
    const f = m.f, x = f/8000*canvasW;
    ctx.strokeStyle = 'rgba(0,255,0,0.5)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvasH); ctx.stroke();
    ctx.fillStyle = '#0f0';
    if(x - lastLblX < 55) bump++; else bump = 0;
    ctx.fillText(m.label+' '+f.toFixed(0), x+3, 2+(i+bump)*13);
    lastLblX = x;
  });
  // dB gridlines: without them a saved graph cannot show how far peaks sit above the noise
  ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1;
  ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.font = '9px monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  for(let db=-100; db<=-20; db+=20){
    const y = canvasH - ((db+120)/110)*canvasH;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvasW,y); ctx.stroke();
    ctx.fillText(db+' dB', 3, y-2);
  }
  ctx.font = '11px monospace';
  if(envBuf){
    // blue = max envelope, survives Stop and stays on screen until the next session
    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 1.5; ctx.beginPath();
    const NH = Math.min(envBuf.length, Math.floor(8000/(binWidth||11.7)));
    for(let i=0;i<NH;i++){
      const x = i/NH*canvasW;
      const y = canvasH - ((envBuf[i]+120)/110)*canvasH;
      i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    }
    ctx.stroke();
    // flags sit on the strongest bin inside each prediction window — the same rule the
    // table uses, so the picture and the numbers can never disagree again
    ctx.fillStyle = '#ff0'; ctx.textBaseline = 'bottom';
    p.ladder.slice(0,6).forEach(mm=>{
      const fp = mm.f, bw = binWidth || 11.7;
      const lo = Math.max(3, Math.floor(fp*0.90/bw));
      const hi = Math.min(envBuf.length-4, Math.ceil(fp*1.10/bw));
      let bi = -1, best = -999;
      for(let i=lo;i<=hi;i++){ if(envBuf[i] > best){ best = envBuf[i]; bi = i; } }
      if(bi < 0) return;
      const x = (bi*bw)/8000*canvasW;
      ctx.fillRect(x-1, canvasH-60, 2, 60);
      ctx.fillText((bi*bw).toFixed(0), x+3, canvasH-62);
    });
  }
  if(smoothBuf && running){
    ctx.strokeStyle = '#888'; ctx.lineWidth = 1; ctx.beginPath();
    const N = Math.min(smoothBuf.length, Math.floor(8000/(binWidth||11.7)));
    for(let i=0;i<N;i++){
      const x = i/N*canvasW;
      const y = canvasH - ((smoothBuf[i]+120)/110)*canvasH;
      i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    }
    ctx.stroke();
  }
  if(!envBuf){
    ctx.fillStyle = '#444'; ctx.textBaseline = 'middle';
    ctx.fillText(running ? 'listening…' : 'press Start mic', 12, canvasH/2);
  }
  // frequency axis, so a saved graph is readable on its own
  ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.fillStyle = '#666';
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.font = '10px monospace';
  for(let f=1000; f<=8000; f+=1000){
    const x = f/8000*canvasW;
    ctx.beginPath(); ctx.moveTo(x, canvasH-12); ctx.lineTo(x, canvasH-6); ctx.stroke();
    ctx.fillText((f/1000)+'k', x, canvasH-14);
  }
  ctx.textAlign = 'right'; ctx.textBaseline = 'top'; ctx.fillStyle = '#555';
  ctx.fillText('mic '+(micLevelDb>-120 ? Math.round(micLevelDb)+'dB' : '--'), canvasW-6, 4);
}
// the whole analysed spectrum, so anyone can re-run the numbers without the browser
function spectrumCSV(spec, p, taps, modeRows, missing, others, axisCheck, dampParts){
  const bw = binWidth || sampleRate/FFT_SIZE;
  const D = new Date(), z = n=>String(n).padStart(2,'0');
  const L = [];
  L.push('# spring-tap session '+tapNo+'  '+z(D.getDate())+'/'+z(D.getMonth()+1)+'/'+D.getFullYear()+' '+
         z(D.getHours())+':'+z(D.getMinutes())+':'+z(D.getSeconds()));
  L.push('# geometry_mm: L='+inL.value+' W='+inW.value+' T='+inT.value+' mass_g='+(inM.value||'blank'));
  L.push('# assumed: E_L_GPa='+inE1.value+' E_W_GPa='+inE2.value+' ends='+inB.value);
  L.push('# rho_kgm3='+p.rho.toFixed(1)+(p.hasMass?' measured':' ASSUMED_1900'));
  const sorted = Float32Array.from(spec).sort();
  const med = sorted[Math.floor(sorted.length/2)];
  L.push('# mic: sample_rate='+(sampleRate||0)+' FFT='+FFT_SIZE+' bin_hz='+bw.toFixed(4)+
         ' taps='+taps+' noise_floor_db(median)='+med.toFixed(1));
  L.push('# ladder_hz: '+p.ladder.slice(0,6).map(m=>m.label+'='+m.f.toFixed(1)).join(' '));
  // exactly the table, row for row
  L.push('# mode, freq_hz, level_db, dev_hz, dev_pct, e_est_gpa');
  modeRows.forEach(r=>L.push('# '+r.label+', '+r.freq.toFixed(2)+', '+r.db.toFixed(1)+', '+
         r.bd.toFixed(2)+', '+r.pct.toFixed(2)+', '+r.eEst.toFixed(2)));
  others.forEach(r=>L.push('# '+(r.axial?'below_f1':'unmatched')+', '+r.freq.toFixed(2)+', '+r.db.toFixed(1)+
         ', , , '));
  if(axisCheck) L.push('# axis_check: '+axisCheck);
  if(dampParts && dampParts.length) L.push('# damping: '+dampParts.join(' | '));
  if(missing.length) L.push('# no_response: '+missing.join(' '));
  L.push('# columns: freq_hz,envelope_db');
  for(let i=1;i<spec.length;i++) L.push((i*bw).toFixed(2)+','+spec[i].toFixed(2));
  return L.join('\n');
}
// a saved graph must stand alone: plot band plus header and footer text
function exportGraph(title, summary){
  const pad = 24, LH = 14;
  // wrap the footer instead of letting it run off the right edge
  const lines = [];
  let cur = '';
  const probe = document.createElement('canvas').getContext('2d');
  probe.font = '12px monospace';
  summary.split(' ').forEach(w=>{
    const t = cur ? cur+' '+w : w;
    if(probe.measureText(t).width > canvasW-14 && cur){ lines.push(cur); cur = w; } else cur = t;
  });
  if(cur) lines.push(cur);
  const h2 = canvasH + pad + 8 + lines.length*LH;
  const c = document.createElement('canvas');
  c.width = canvasW; c.height = h2;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0,0,c.width,h2);
  g.drawImage(canvas, 0, pad);
  g.font = '12px monospace'; g.textBaseline = 'top'; g.textAlign = 'left';
  g.fillStyle = '#ddd'; g.fillText(title, 6, 5);
  g.fillStyle = '#888';
  lines.forEach((ln,i)=>g.fillText(ln, 6, pad + canvasH + 6 + i*LH));
  return c.toDataURL('image/png');
}
// always-on loop from page load (same as proven tuner)
function render(now){
  animId = requestAnimationFrame(render);
  if(now - lastFrameTime < 1000/FPS) return;
  lastFrameTime = now;
  if(running){
    const raw = capture();
    if(raw) onNewFrame(raw);
    // hands-free onset: a tap is a SHARP RISE above the slowly-tracked room floor.
    // (Floor ignores the rise; the rise test ignores the decay tail — that combination is
    // what lets several taps follow each other quickly without false triggers.)
    if(floorDb === -999) floorDb = micLevelDb;
    if(micLevelDb > floorDb + 12 && micLevelDb > -55 && micLevelDb > prevLvl + 6 && now - lastTapAt > 250){
      lastTapAt = now;
      if(!session) startSession(true);      // first tap opens a 5 s session…
      else session.taps++;                  // …later taps just add to the same envelope
    }
    prevLvl = micLevelDb;
    floorDb = Math.min(micLevelDb, floorDb + 0.3);
    if(session){
      const left = Math.max(0, (session.endsAt - now)/1000);
      statusEl.textContent = 'Recording — '+left.toFixed(1)+' s left · '+session.taps+' tap'+(session.taps===1?'':'s')+' · tap anywhere on the spring';
      if(left <= 0) endSession();
    }
    // loud, unmistakable proof of whether audio is actually arriving — written only on change
    // so it cannot clobber the Capture / analysed messages
    const live = micLevelDb > -60;
    silentFrames = live ? 0 : silentFrames + 1;
    if(live && lastLive !== true){
      lastLive = true;
      if(!session && now - lastResultAt > 3000) statusEl.textContent = 'MIC LIVE — audio arriving ('+Math.round(micLevelDb)+' dB). Just tap the spring.';
    } else if(!live && silentFrames === 61){
      lastLive = false;
      if(!session && now - lastResultAt > 3000) statusEl.textContent = 'MIC LIVE but SILENT ('+Math.round(micLevelDb)+' dB) — mic is open, no sound reaching the page. Wrong input device, muted mic, or browser focus elsewhere.';
    }
  }
  drawSpectrum();
}
// session capture + analysis
function startSession(firstIsTap){
  if(!running || session) return;
  // seed from the frame the tap just landed in, otherwise the first tap of the session is lost
  const last = frames.length ? frames[frames.length-1] : null;
  envBuf = last ? Float32Array.from(last) : null;
  session = { endsAt: performance.now() + SESSION_MS, taps: firstIsTap ? 1 : 0, startIdx: frames.length };
}
function endSession(){
  if(!session) return;
  const taps = session.taps, start = session.startIdx; session = null;
  if(!envBuf){ statusEl.textContent = 'Nothing captured.'; return; }
  // damping only means something on ONE ring-down — pass it only for a single-tap session
  analyse(envBuf, taps, (taps === 1 && start >= 0) ? frames.slice(start, start+45) : null);
}
function fitDecay(slice, freq){
  const bin = Math.round(freq/binWidth), pts = [];
  slice.forEach((fr,i)=>{
    let m = -120;
    for(let d=-2;d<=2;d++){ const v = fr[bin+d]; if(v > m) m = v; }
    pts.push([i/FPS, m]);
  });
  let pk = 0; for(let i=1;i<pts.length;i++) if(pts[i][1] > pts[pk][1]) pk = i;
  const seg = pts.slice(pk).filter(q=>q[1] > -95);
  if(seg.length < 5) return null;
  const n = seg.length; let sx=0,sy=0,sxx=0,sxy=0;
  for(const [x,y] of seg){ sx+=x; sy+=y; sxx+=x*x; sxy+=x*y; }
  const slope = (n*sxy - sx*sy)/(n*sxx - sx*sx);
  if(!(slope < -1)) return null;                      // steady tone / noise, not a ring-down
  const w0 = 2*Math.PI*freq, zeta = (-slope/8.686)/w0; // dB/s -> amplitude decay -> damping ratio
  return { slope, t60: 60/Math.abs(slope), zeta, Q: 1/(2*zeta) };
}
function analyse(spec, taps, decaySlice){
  const p = calcPred(), f1 = p.ladder[0].f;
  const rows = [], missing = [];
  // SEARCH FOR EACH PREDICTED MODE instead of hunting local maxima. A broad hump fails
  // every peak-picking rule (no strict maximum, little local prominence) yet is obviously
  // a mode on screen — Nigel's p4. So take the strongest bin within +/-10% of each
  // prediction and only ask whether it stands clear of that window's own shoulders.
  // Six candidates, because the ladder mixes both axes and the first four may all be one
  // family. Each mode carries its OWN modulus: E is read from the axis it was predicted on.
  p.ladder.slice(0,6).forEach((m,idx)=>{
    const fp = m.f;
    const lo = Math.max(3, Math.floor(fp*0.90/binWidth));
    const hi = Math.min(spec.length-4, Math.ceil(fp*1.10/binWidth));
    let bi = -1, best = -999;
    for(let i=lo;i<=hi;i++){ if(spec[i] > best){ best = spec[i]; bi = i; } }
    const shoulder = Math.min(spec[lo], spec[hi]);
    // only the four displayed modes get a “no response” note; candidates 5-6 are just
    // backups in case the ladder is all one family
    if(bi < 0 || best < -78 || (best - shoulder) < 6){ if(idx < 4) missing.push(m.label); return; }
    // if the window holds several local maxima, take the one NEAREST the prediction
    // among those within 3 dB of the window maximum (a side peak must not hijack the mode)
    let near = bi;
    for(let i=lo+1;i<hi;i++){
      if(spec[i] >= spec[i-1] && spec[i] >= spec[i+1] && spec[i] > best - 3 &&
         Math.abs(i - Math.round(fp/binWidth)) < Math.abs(near - Math.round(fp/binWidth))) near = i;
    }
    bi = near;
    const y1=spec[bi-1], y2=spec[bi], y3=spec[bi+1], den=2*y2-y1-y3;
    let off = den > 0 ? (y3-y1)/(2*den) : 0;
    if(!isFinite(off) || Math.abs(off) > 0.5) off = 0;
    const freq = (bi+off)*binWidth;
    rows.push({freq, db:y2, label:m.label, axis:m.axis, bin:bi, bd:Math.abs(freq-fp), pct:100*Math.abs(freq-fp)/fp,
               eEst:(m.E/1e9)*(freq/fp)*(freq/fp), isMode:true});
  });
  // one peak cannot be two modes: whichever prediction it sits closest to keeps it
  const claimed = new Map();
  rows.forEach(r=>{
    const c = claimed.get(r.bin);
    if(!c){ claimed.set(r.bin, r); return; }
    if(r.pct < c.pct){ c.dup = true; claimed.set(r.bin, r); } else r.dup = true;
  });
  const modeRows = rows.filter(r=>!r.dup);
  // anything prominent that is NOT inside a mode window: show up to 3, labelled for what it is
  const others = findSpringPeaks(spec, -80)
    .filter(k=>!p.ladder.some(m=>Math.abs(k.freq-m.f)/m.f < 0.12))
    .map(k=>({freq:k.freq, db:k.db, bd:null, pct:null, isMode:false, axial:k.freq < f1*0.7}))
    .slice(0,3);
  const show = modeRows.concat(others).sort((a,b)=>a.freq-b.freq);
  tapNo++;
  let html = '<div id="sess'+tapNo+'"><div class="taphead">Session '+tapNo+' · '+taps+' tap'+(taps===1?'':'s')+' · max envelope</div>';
  if(show.length){
    html += '<table><tr><th>Hz</th><th>dB</th><th>Mode</th><th>ΔHz</th><th>Δ%</th><th>E est (GPa)</th></tr>';
    show.forEach(r=>{
      const cls = r.pct === null ? '' : (r.pct<3 ? 'good' : (r.pct<8 ? '' : 'bad'));
      const label = r.axial ? 'below f1' : (r.isMode ? r.label : '—');
      html += '<tr><td class="peakline">'+r.freq.toFixed(1)+'</td><td>'+r.db.toFixed(0)+'</td><td>'+label+'</td>'+
        '<td class="'+cls+'">'+(r.bd === null ? '—' : r.bd.toFixed(1))+'</td>'+
        '<td class="'+cls+'">'+(r.pct === null ? '—' : r.pct.toFixed(1))+'</td>'+
        '<td class="'+(r.pct > 8 ? 'bad' : '')+'">'+(r.isMode ? r.eEst.toFixed(1) : '—')+'</td></tr>';
    });
    html += '</table>';
  }
  // an axis whose modes disagree on E is telling you those peaks are not one family
  const byAxis = {};
  modeRows.forEach(r=>{ (byAxis[r.axis] = byAxis[r.axis] || []).push(r.eEst); });
  const axisCheck = Object.keys(byAxis).sort().map(k=>{
    const es = byAxis[k];
    if(es.length < 2) return k+': '+es[0].toFixed(1)+' GPa (one mode)';
    const lo = Math.min.apply(null,es), hi = Math.max.apply(null,es), sp = 100*(hi-lo)/lo;
    return k+': '+es.map(e=>e.toFixed(1)).join(' / ')+' GPa, spread '+sp.toFixed(0)+'%'+
      (sp > 10 ? ' — INCONSISTENT, these are not all '+k+' modes' : ' — consistent');
  }).join(' · ');
  if(axisCheck) html += '<div class="dim">Modulus check by axis — '+axisCheck+'</div>';
  if(missing.length) html += '<div class="dim">No response at '+missing.join(', ')+
    ' — that mode was not excited (or the tap missed it). Nothing is hidden: an unmatched peak still shows as “—”.</div>';
  // damping: one ring-down, per mode — ζ and Q from the decay slope (no half-power bandwidth needed)
  const dampParts = [];
  if(decaySlice && decaySlice.length >= 8){
    modeRows.forEach(r=>{
      const d = fitDecay(decaySlice, r.freq);
      if(d) dampParts.push(r.label+': T60 '+d.t60.toFixed(2)+' s · Q '+(d.Q>999?Math.round(d.Q):d.Q.toFixed(0)));
    });
    if(dampParts.length) html += '<div class="dim">Damping from this single ring-down — '+dampParts.join(' · ')+'</div>';
  }
  html += '<div class="dim">Each mode is the strongest response within ±10% of its prediction, whatever its level. E comes from frequency alone.</div>'+
    '<div class="shot" id="shot'+tapNo+'"></div></div>';
  if(tapNo===1) resultEl.innerHTML = '';
  resultEl.insertAdjacentHTML('beforeend', html);
  resultEl.scrollTop = resultEl.scrollHeight;
  lastResultAt = performance.now();
  // save the graph with the numbers, so peak quality and noise can be reviewed later
  const shotId = tapNo;
  const dims = (+inL.value)+'\u00d7'+(+inW.value)+'\u00d7'+(+inT.value)+' mm \u00b7 rho '+p.rho.toFixed(0)+' kg/m3'+(p.hasMass?'':' (assumed)')+(inB.value==='cant'?' \u00b7 cantilever':' \u00b7 free-free');
  const D = new Date(), p2 = n=>String(n).padStart(2,'0');
  const when = p2(D.getDate())+'/'+p2(D.getMonth()+1)+'/'+D.getFullYear()+' '+p2(D.getHours())+':'+p2(D.getMinutes());
  const titleTxt = 'Session '+tapNo+' \u00b7 '+taps+' tap'+(taps===1?'':'s')+' \u00b7 '+when+' \u00b7 '+dims+
    ' \u00b7 mic '+(sampleRate/1000).toFixed(1)+'kHz FFT '+FFT_SIZE;
  const summaryTxt = 'measured / dev vs prediction / E:  ' +
    modeRows.map(r=>r.label+' '+r.freq.toFixed(0)+'Hz '+(r.pct>=0?'+':'')+r.pct.toFixed(1)+'% '+r.eEst.toFixed(1)+'GPa').join('  ') +
    (missing.length ? '   no response: '+missing.join(', ') : '');
  requestAnimationFrame(()=>{
    drawSpectrum();
    const el = document.getElementById('shot'+shotId);
    if(!el) return;
    const url = exportGraph(titleTxt, summaryTxt);
    const stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,'');
    const csv = spectrumCSV(spec, p, taps, modeRows, missing, others, axisCheck, dampParts);
    el.innerHTML = '<a href="'+url+'" download="spring-session-'+shotId+'-'+stamp+'.png">'+
      '<img alt="session '+shotId+' spectrum" src="'+url+'"></a>'+
      '<div class="dim">Click the graph to save it as a PNG · '+
      '<a href="data:text/csv;charset=utf-8,'+encodeURIComponent(csv)+'" '+
      'download="spring-session-'+shotId+'-'+stamp+'.csv">save the raw data (CSV)</a></div>';
  });
  statusEl.textContent = 'Session '+tapNo+' saved — '+modeRows.length+' mode'+(modeRows.length===1?'':'s')+
    ' found from '+taps+' tap'+(taps===1?'':'s')+'.';
}
// buttons
btnStart.addEventListener('click', async ()=>{
  if(running){ statusEl.textContent = 'Mic already live — just tap the spring.'; return; }
  statusEl.textContent = 'Requesting mic...';
  frames = []; smoothBuf = null; session = null;
  const ok = await startAudio();
  if(!ok) return;
  running = true;
  requestWake();
  btnCap.disabled = false;
  statusEl.textContent = 'MIC LIVE — tap the spring; each 5 s burst of tapping becomes one result.';
});
btnStop.addEventListener('click', ()=>{
  // deliberately keeps the blue envelope: you asked to be able to stop and still read it
  running = false; session = null; stopAudio(); releaseWake();
  btnCap.disabled = true;
  statusEl.textContent = envBuf ? 'Mic off — envelope still on screen; Clear log to wipe it.' : 'Mic off.';
});
btnCap.addEventListener('click', ()=>startSession(false));
document.getElementById('btnClear').addEventListener('click', ()=>{
  if(!confirm('Clear all sessions and the blue envelope?')) return;
  tapNo = 0; resultEl.innerHTML = '<span class="dim">Cleared — tap the spring when ready.</span>';
  envBuf = null; livePeaks = [];
  statusEl.textContent = 'Cleared.';
});
for(const el of [inL,inW,inT,inM,inE1,inE2,inB]) el.addEventListener('change', showPred);
// surface JS errors in status (same as proven tuner)
window.addEventListener('error', (e)=>{ try{ statusEl.textContent = 'JS err: '+(e.message||'unknown'); }catch(_){} });
window.addEventListener('resize', resizeCanvas);
function init(){ resizeCanvas(); showPred(); if(animId) cancelAnimationFrame(animId); animId = requestAnimationFrame(render); }
init();
</script>
